<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Code CLA</title>
  </head>
  
  <body>
    <header>
        <img src="assets/coding.png">
    </header>

    <h1>Login Now!</h1>

    <section id="sign-in-form">

        <form action="signinform.html" method="post">
            <input type="email" id="sign-up-email" name="sign-up-email" placeholder="Email">
            <input type="password" id="sign-up-password" name="sign-up-password" placeholder="Password">
            <input type="submit" value="Sign In">
        </form>

        <span>New to CodeCLA</span>
        <a href="/signup.html">Login</a>
    </section>
  </body>
