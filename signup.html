<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Code CLA</title>
  </head>
  
  <body>
    <header>
        <img src="assets/coding.png">
    </header>

    <h1>Join Coders Now!</h1>

    <section id="sign-up-form">

        <form action="signupform.html" method="post">
            <input type="text" id="sign-up-first-name" name="sign-up-first-name" placeholder="First Name">
            <input type="text" id="sign-up-last-name" name="sign-up-last-name" placeholder="Last Name">
            <input type="email" id="sign-up-email" name="sign-up-email" placeholder="Email">
            <input type="password" id="sign-up-password" name="sign-up-password" placeholder="Password">
            <input type="submit" value="Sign Up">
        </form>
        <span>Already have an account?</span>
        <a href="/signin.html">Login</a>
    </section>
  </body>
