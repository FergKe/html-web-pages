<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@200;300;400;600;700;800;900&family=Noto+Sans+Khojki&display=swap"
      rel="stylesheet"
    />
    <title>Code CLA</title>
  </head>

  <body>
    <div class="form-pages">
      <div class="image">
        <img src="assets/coding.png" />
      </div>

      <div class="sign-up-form">
        <h3>Join Coders Now!</h3>

        <form action="signupform.html" method="post">
          <input
            type="text"
            id="sign-up-first-name"
            name="sign-up-first-name"
            placeholder="First Name"
          />
          <input
            type="text"
            id="sign-up-last-name"
            name="sign-up-last-name"
            placeholder="Last Name"
          />
          <input
            type="email"
            id="sign-up-email"
            name="sign-up-email"
            placeholder="Email"
          />
          <input
            type="password"
            id="sign-up-password"
            name="sign-up-password"
            placeholder="Password"
          />
          <button type="submit">Sign Up</button>
        </form>
        <span>Already have an account? <a href="/signin.html">Login</a></span>
      </div>
    </div>
  </body>
</html>
